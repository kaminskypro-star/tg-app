<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Каминский — разбор YouTube</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 50% -200px, #1f2937, #0b0f14);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrapper {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 12px;
      line-height: 1.3;
    }

    p {
      font-size: 16px;
      line-height: 1.5;
      opacity: 0.9;
      margin: 0 0 28px;
    }

    .btn {
      display: block;
      width: 100%;
      background: #38bdf8;
      color: #020617;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      border-radius: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(56,189,248,0.35);
    }

    .note {
      margin-top: 14px;
      font-size: 13px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <img src="avatar.jpg" alt="Даниил Каминский" class="avatar" />

    <h1>Я Каминский.</h1>

    <p>
      Если ты снимаешь YouTube и чувствуешь, что рост встал —
      давай разберём, почему.
    </p>

    <a class="btn" href="https://t.me/kaminskyid" target="_blank">
      Написать мне в Telegram
    </a>

    <div class="note">
      Без курсов. Без прогревов. Просто разговор по делу.
    </div>
  </div>

</body>
</html>
